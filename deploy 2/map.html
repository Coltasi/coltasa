<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coltasa map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&display=swap">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Hanken Grotesk",system-ui,sans-serif}
svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<svg id="m" role="img" aria-label="World map with pins in San Francisco, New York, Charleston, London, Madrid, Barcelona, Hong Kong, Singapore and Sydney"></svg>
<script>
const C = { land:'#4a5157', stroke:'#2b3034', grat:'rgba(244,241,234,.06)', pin:'#c99468', ring:'#f4f1ea', text:'#f4f1ea', line:'rgba(201,148,104,.55)' };
// [name, [lon,lat], label dx, dy, anchor]
const cities = [
  ['San Francisco',[-122.42,37.77], 12,-6,'start'],
  ['New York',[-74.01,40.71], 10,-10,'start'],
  ['Charleston',[-79.93,32.78], -12,16,'end'],
  ['London',[-0.13,51.51], -12,-10,'end'],
  ['Barcelona',[2.17,41.39], 12,-4,'start'],
  ['Madrid',[-3.70,40.42], -12,16,'end'],
  ['Hong Kong',[114.17,22.32], 12,-6,'start'],
  ['Singapore',[103.82,1.35], -12,14,'end'],
  ['Sydney',[151.21,-33.87], -12,18,'end'],
];
const svg = d3.select('#m');
const proj = d3.geoNaturalEarth1();
const path = d3.geoPath(proj);
let land = null;
function draw(){
  const W = innerWidth, H = innerHeight;
  svg.attr('viewBox',`0 0 ${W} ${H}`).selectAll('*').remove();
  if(!land) return;
  const noAnt = {type:'FeatureCollection',features:land.features.filter(f=>f.id!=='010')};
  proj.fitExtent([[8,8],[W-8,H-8]], noAnt);
  svg.append('path').attr('d',path(d3.geoGraticule10())).attr('fill','none').attr('stroke',C.grat);
  svg.append('path').attr('d',path(noAnt)).attr('fill',C.land).attr('stroke',C.stroke).attr('stroke-width',.5);
  const s = Math.max(.7, Math.min(1.2, W/900));
  const g = svg.append('g');
  cities.forEach(([n,p,dx,dy,a])=>{
    const [x,y] = proj(p);
    g.append('circle').attr('cx',x).attr('cy',y).attr('r',9*s).attr('fill','none').attr('stroke',C.line).attr('stroke-width',1.5);
    g.append('circle').attr('cx',x).attr('cy',y).attr('r',4.5*s).attr('fill',C.pin).attr('stroke',C.ring).attr('stroke-width',1.5);
    g.append('text').attr('x',x+dx*s).attr('y',y+dy*s).attr('text-anchor',a).attr('fill',C.text)
      .attr('font-size',13*s).attr('font-weight',700).attr('letter-spacing','.04em').text(n.toUpperCase());
  });
}
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(t=>{
  land = topojson.feature(t, t.objects.countries); draw();
});
addEventListener('resize', draw);
</script>
</body>
</html>
